name: Demand engine

on:
  schedule:
    - cron: "17 * * * *"   # hourly, $0 (GitHub Actions free tier)
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Count waitlist issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/count_waitlist.py data/demand.json
      - name: Commit if changed
        run: |
          if git diff --quiet data/demand.json; then
            echo "no change"
          else
            git config user.name "cwi-demand-engine"
            git config user.email "cwi-demand-engine@users.noreply.github.com"
            git add data/demand.json
            git commit -m "demand: update snapshot [skip ci]"
            git push
          fi
